<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIPO Q&amp;A LIVE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f13; color: #e8e8ec; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }

  .header { border-bottom: 1px solid #1e1e28; padding: 0 20px; position: sticky; top: 0; background: #0f0f13; z-index: 10; }
  .header-inner { max-width: 700px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 10px; }
  .header-title { display: flex; align-items: center; gap: 8px; }
  .header-title h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; }
  .live-badge { background: #22c55e22; color: #22c55e; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; border: 1px solid #22c55e44; white-space: nowrap; }
  .host-area { display: flex; gap: 6px; align-items: center; }
  .host-input { background: #1e1e28; border: 1px solid #2e2e3e; color: #e8e8ec; padding: 6px 10px; border-radius: 8px; font-size: 13px; width: 90px; outline: none; font-family: inherit; }
  .btn-host { background: #7c3aed; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; white-space: nowrap; }
  .host-badge { background: #7c3aed22; color: #a78bfa; font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid #7c3aed44; font-weight: 600; white-space: nowrap; }

  .main { max-width: 700px; margin: 0 auto; padding: 20px 20px 80px; }

  .ask-box { background: #16161f; border: 1px solid #1e1e28; border-radius: 14px; padding: 16px 18px; margin-bottom: 20px; }
  .ask-label { font-size: 12px; font-weight: 600; color: #6b6b80; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .ask-box input[type=text], .ask-box textarea { width: 100%; background: #0f0f13; border: 1px solid #2e2e3e; color: #e8e8ec; padding: 9px 12px; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 8px; display: block; }
  .ask-box textarea { resize: vertical; }

  /* Image upload area */
  .img-upload-area { border: 1.5px dashed #2e2e3e; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; display: flex; align-items: center; gap: 10px; }
  .img-upload-area:hover { border-color: #6366f1; }
  .img-upload-area.has-img { border-color: #6366f144; }
  .img-upload-icon { font-size: 20px; opacity: 0.5; }
  .img-upload-text { font-size: 13px; color: #5a5a70; }
  .img-preview-wrap { position: relative; display: inline-block; margin-bottom: 8px; }
  .img-preview { max-width: 100%; max-height: 200px; border-radius: 8px; display: block; }
  .img-remove { position: absolute; top: 6px; right: 6px; background: #0f0f13cc; color: #e8e8ec; border: none; border-radius: 99px; width: 24px; height: 24px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  input[type=file] { display: none; }

  .ask-footer { display: flex; justify-content: space-between; align-items: center; }
  .ask-hint { font-size: 12px; color: #3a3a50; }
  .btn-submit { background: #6366f1; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit; transition: background 0.15s; }
  .btn-submit:disabled { background: #2e2e3e; color: #4a4a60; cursor: default; }

  .tabs { display: flex; gap: 4px; background: #16161f; border: 1px solid #1e1e28; border-radius: 10px; padding: 4px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 8px 0; border-radius: 7px; border: none; background: transparent; color: #5a5a70; font-weight: 400; font-size: 14px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .tab.active { background: #1e1e2e; color: #e8e8ec; font-weight: 600; }

  .host-name-row { margin-bottom: 12px; }
  .host-name-row input { width: 100%; background: #16161f; border: 1px solid #7c3aed44; color: #e8e8ec; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; }

  .card { background: #16161f; border: 1px solid #1e1e28; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .card-top { display: flex; gap: 10px; align-items: flex-start; }
  .card-body { flex: 1; min-width: 0; }
  .card-text { font-size: 15px; line-height: 1.5; margin-bottom: 5px; }
  .card-meta { font-size: 12px; color: #4a4a60; margin-bottom: 6px; }
  .card-meta .asker { color: #6366f1; font-weight: 600; }
  .card-img { max-width: 100%; max-height: 260px; border-radius: 8px; margin-top: 6px; cursor: pointer; display: block; }
  .vote-col { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 34px; }
  .btn-vote { background: transparent; color: #4a4a60; border: 1px solid #2e2e3e; border-radius: 8px; padding: 4px 8px; cursor: pointer; font-size: 13px; font-family: inherit; transition: all 0.15s; }
  .btn-vote.voted { background: #6366f122; color: #818cf8; border-color: #6366f144; }
  .vote-count { font-size: 13px; font-weight: 600; color: #4a4a60; }
  .vote-count.has-votes { color: #818cf8; }

  .answer-block { margin-top: 10px; padding: 10px 13px; background: #1a1a26; border-radius: 9px; border-left: 3px solid #22c55e; }
  .answer-by { font-size: 12px; color: #22c55e; font-weight: 600; margin-bottom: 3px; }
  .answer-text { font-size: 14px; line-height: 1.5; color: #d0d0dc; }
  .answer-img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 6px; cursor: pointer; display: block; }

  .host-answer-row { margin-top: 10px; display: flex; gap: 7px; align-items: flex-start; flex-wrap: wrap; }
  .host-answer-row input[type=text] { flex: 1; min-width: 140px; background: #0f0f13; border: 1px solid #2e2e3e; color: #e8e8ec; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; }
  .btn-answer { background: #22c55e; color: #000; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; white-space: nowrap; }
  .btn-attach { background: #1e1e28; border: 1px solid #2e2e3e; color: #a0a0b0; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit; white-space: nowrap; }
  .host-img-preview { width: 100%; }
  .host-img-preview img { max-height: 120px; border-radius: 6px; margin-top: 6px; }

  .btn-delete { background: transparent; border: none; color: #3a3a50; font-size: 12px; cursor: pointer; font-family: inherit; margin-top: 6px; float: right; }

  .empty { text-align: center; padding: 48px 0; color: #3a3a50; font-size: 15px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #000; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 999; display: none; }
  .toast.error { background: #f87171; }

  /* Uploading spinner */
  .uploading { opacity: 0.5; pointer-events: none; }

  /* Lightbox */
  .lightbox { display: none; position: fixed; inset: 0; background: #000000cc; z-index: 1000; align-items: center; justify-content: center; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 10px; }
  .lightbox-close { position: fixed; top: 16px; right: 20px; background: transparent; border: none; color: #fff; font-size: 28px; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-title">
      <h1>BIPO Q&amp;A LIVE</h1>
      <span class="live-badge">● LIVE</span>
    </div>
    <div class="host-area" id="hostArea">
      <input class="host-input" type="password" id="hostCodeInput" placeholder="Host code" onkeydown="if(event.key==='Enter')tryHost()">
      <button class="btn-host" onclick="tryHost()">Host</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="ask-box">
    <div class="ask-label">Ask a Question</div>
    <input type="text" id="askerName" placeholder="Your name (optional)">
    <textarea id="questionText" rows="3" placeholder="Type your question here…" oninput="updateSubmitBtn()"></textarea>

    <!-- Image upload -->
    <div id="imgUploadArea" class="img-upload-area" onclick="document.getElementById('fileInput').click()">
      <span class="img-upload-icon">📎</span>
      <span class="img-upload-text">Attach an image (optional)</span>
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
    <div id="imgPreviewWrap" style="display:none" class="img-preview-wrap">
      <img id="imgPreview" class="img-preview">
      <button class="img-remove" onclick="clearImage()">✕</button>
    </div>

    <div class="ask-footer">
      <span class="ask-hint">Ctrl+Enter to send</span>
      <button class="btn-submit" id="btnSubmit" disabled onclick="submitQuestion()">Submit</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabOpen" onclick="switchTab('open')">Open (<span id="openCount">0</span>)</button>
    <button class="tab" id="tabAnswered" onclick="switchTab('answered')">Answered (<span id="answeredCount">0</span>)</button>
  </div>

  <div class="host-name-row" id="hostNameRow" style="display:none">
    <input type="text" id="hostName" placeholder="Host display name e.g. BIPO Team">
  </div>

  <div id="questionList"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="">
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiFNnUzVa6Hr98lEF4Rs3NgAOiRFfQhqM",
  authDomain: "bipo-qna-live.firebaseapp.com",
  databaseURL: "https://bipo-qna-live-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bipo-qna-live",
  storageBucket: "bipo-qna-live.firebasestorage.app",
  messagingSenderId: "167645059326",
  appId: "1:167645059326:web:df0f0a8bc391e2ec2d2daf"
};

// Imgur client ID — register free at api.imgur.com/oauth2/addclient
const IMGUR_CLIENT_ID = "546c25a59c58ad7"; // public demo key — replace with your own
const HOST_SECRET = "bipo2024";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const qRef = ref(db, "questions");

let isHost = false;
let currentTab = "open";
let allQuestions = [];
let selectedFile = null;
let hostSelectedFile = {};

function getUid() {
  let uid = localStorage.getItem("bipo-uid");
  if (!uid) { uid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("bipo-uid", uid); }
  return uid;
}

function timeAgo(ts) {
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return `${d}s`;
  if (d < 3600) return `${Math.floor(d/60)}m`;
  if (d < 86400) return `${Math.floor(d/3600)}h`;
  return `${Math.floor(d/86400)}d`;
}

// Upload to Imgur
async function uploadToImgur(file) {
  const formData = new FormData();
  formData.append("image", file);
  const res = await fetch("https://api.imgur.com/3/image", {
    method: "POST",
    headers: { Authorization: `Client-ID ${IMGUR_CLIENT_ID}` },
    body: formData
  });
  const json = await res.json();
  if (json.success) return json.data.link;
  throw new Error("Upload failed");
}

onValue(qRef, snap => {
  const data = snap.val() || {};
  allQuestions = Object.entries(data).map(([id, v]) => ({ id, ...v }));
  renderList();
});

function renderList() {
  const open = allQuestions.filter(q => !q.answered).sort((a,b) => (b.likes||0)-(a.likes||0) || b.ts-a.ts);
  const answered = allQuestions.filter(q => q.answered).sort((a,b) => b.answeredTs-a.answeredTs);
  document.getElementById("openCount").textContent = open.length;
  document.getElementById("answeredCount").textContent = answered.length;

  const list = currentTab === "open" ? open : answered;
  const uid = getUid();
  const container = document.getElementById("questionList");

  if (list.length === 0) {
    container.innerHTML = `<div class="empty">${currentTab === "open" ? "No questions yet — be the first to ask!" : "No answered questions yet."}</div>`;
    return;
  }

  container.innerHTML = list.map(q => {
    const liked = (q.likedBy || {})[uid];
    const likes = q.likes || 0;
    return `
    <div class="card">
      <div class="card-top">
        <div class="card-body">
          <div class="card-text">${escHtml(q.text)}</div>
          <div class="card-meta"><span class="asker">${escHtml(q.asker||'Anonymous')}</span> · ${timeAgo(q.ts)}</div>
          ${q.imageUrl ? `<img class="card-img" src="${q.imageUrl}" onclick="openLightbox('${q.imageUrl}')" alt="attached image">` : ''}
        </div>
        <div class="vote-col">
          <button class="btn-vote ${liked?'voted':''}" onclick="toggleLike('${q.id}')">▲</button>
          <span class="vote-count ${likes>0?'has-votes':''}">${likes}</span>
        </div>
      </div>
      ${q.answered ? `
        <div class="answer-block">
          <div class="answer-by">✓ ${escHtml(q.answeredBy||'Host')} · ${timeAgo(q.answeredTs)}</div>
          <div class="answer-text">${escHtml(q.answer)}</div>
          ${q.answerImageUrl ? `<img class="answer-img" src="${q.answerImageUrl}" onclick="openLightbox('${q.answerImageUrl}')" alt="answer image">` : ''}
        </div>` : ''}
      ${isHost && !q.answered ? `
        <div class="host-answer-row">
          <input type="text" id="ans_${q.id}" placeholder="Type your answer…" onkeydown="if(event.key==='Enter')submitAnswer('${q.id}')">
          <button class="btn-attach" onclick="document.getElementById('hostFile_${q.id}').click()" title="Attach image">📎</button>
          <input type="file" id="hostFile_${q.id}" accept="image/*" onchange="handleHostFile(event,'${q.id}')">
          <button class="btn-answer" onclick="submitAnswer('${q.id}')">Answer</button>
        </div>
        <div class="host-img-preview" id="hostPreview_${q.id}"></div>` : ''}
      ${isHost ? `<button class="btn-delete" onclick="deleteQ('${q.id}')">Delete</button>` : ''}
    </div>`;
  }).join("");
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// File select (question)
window.handleFileSelect = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { showToast("Image too large (max 10MB)", true); return; }
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById("imgPreview").src = ev.target.result;
    document.getElementById("imgPreviewWrap").style.display = "inline-block";
    document.getElementById("imgUploadArea").style.display = "none";
  };
  reader.readAsDataURL(file);
};

window.clearImage = function() {
  selectedFile = null;
  document.getElementById("fileInput").value = "";
  document.getElementById("imgPreviewWrap").style.display = "none";
  document.getElementById("imgUploadArea").style.display = "flex";
};

// File select (host answer)
window.handleHostFile = function(e, qId) {
  const file = e.target.files[0];
  if (!file) return;
  hostSelectedFile[qId] = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const p = document.getElementById(`hostPreview_${qId}`);
    if (p) p.innerHTML = `<img src="${ev.target.result}"><button onclick="clearHostFile('${qId}')" style="background:transparent;border:none;color:#f87171;cursor:pointer;font-size:12px;margin-left:6px;">Remove</button>`;
  };
  reader.readAsDataURL(file);
};

window.clearHostFile = function(qId) {
  hostSelectedFile[qId] = null;
  const p = document.getElementById(`hostPreview_${qId}`);
  if (p) p.innerHTML = "";
};

// Submit question
window.submitQuestion = async function() {
  const text = document.getElementById("questionText").value.trim();
  if (!text) return;
  const asker = document.getElementById("askerName").value.trim() || "Anonymous";
  const btn = document.getElementById("btnSubmit");
  btn.textContent = "Uploading…";
  btn.disabled = true;

  let imageUrl = null;
  if (selectedFile) {
    try { imageUrl = await uploadToImgur(selectedFile); }
    catch { showToast("Image upload failed, submitting without image", true); }
  }

  push(qRef, { text, asker, ts: Date.now(), answered: false, likes: 0, likedBy: {}, ...(imageUrl && { imageUrl }) });
  document.getElementById("questionText").value = "";
  window.clearImage();
  btn.textContent = "Submit";
  showToast("Question submitted!");
};

window.updateSubmitBtn = function() {
  const btn = document.getElementById("btnSubmit");
  if (btn.textContent !== "Uploading…") btn.disabled = !document.getElementById("questionText").value.trim();
};

document.getElementById("questionText").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) window.submitQuestion();
});

window.toggleLike = function(id) {
  const uid = getUid();
  const q = allQuestions.find(x => x.id === id);
  if (!q) return;
  const liked = (q.likedBy||{})[uid];
  update(ref(db, `questions/${id}`), {
    likes: (q.likes||0) + (liked ? -1 : 1),
    [`likedBy/${uid}`]: liked ? null : true
  });
};

window.submitAnswer = async function(id) {
  const input = document.getElementById(`ans_${id}`);
  const text = input?.value?.trim();
  if (!text) return;
  const hostName = document.getElementById("hostName").value.trim() || "Host";
  const btn = document.querySelector(`#ans_${id} ~ button.btn-answer`) || document.querySelector(`[onclick="submitAnswer('${id}')"]`);

  let answerImageUrl = null;
  if (hostSelectedFile[id]) {
    try { answerImageUrl = await uploadToImgur(hostSelectedFile[id]); }
    catch { showToast("Image upload failed", true); }
  }

  update(ref(db, `questions/${id}`), {
    answered: true, answer: text, answeredBy: hostName, answeredTs: Date.now(),
    ...(answerImageUrl && { answerImageUrl })
  });
  window.clearHostFile(id);
};

window.deleteQ = function(id) {
  if (confirm("Delete this question?")) remove(ref(db, `questions/${id}`));
};

window.tryHost = function() {
  const code = document.getElementById("hostCodeInput").value;
  if (code === HOST_SECRET) {
    isHost = true;
    document.getElementById("hostArea").innerHTML = `<span class="host-badge">Host mode</span>`;
    document.getElementById("hostNameRow").style.display = "block";
    renderList();
  } else {
    showToast("Wrong code, try again.", true);
  }
};

window.switchTab = function(tab) {
  currentTab = tab;
  document.getElementById("tabOpen").classList.toggle("active", tab === "open");
  document.getElementById("tabAnswered").classList.toggle("active", tab === "answered");
  renderList();
};

window.openLightbox = function(url) {
  document.getElementById("lightboxImg").src = url;
  document.getElementById("lightbox").classList.add("open");
};

window.closeLightbox = function() {
  document.getElementById("lightbox").classList.remove("open");
};

function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (isError ? " error" : "");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2500);
}
</script>
</body>
</html>
