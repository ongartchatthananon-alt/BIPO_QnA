<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIPO Q&amp;A LIVE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f7; color: #1a1a2e; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; font-size: 16px; }

  .app { display: flex; min-height: 100vh; padding-top: 64px; }

  /* Header */
  .header { border-bottom: 1px solid #dde0e8; padding: 0 24px; position: fixed; top: 0; left: 0; right: 0; background: #fff; z-index: 20; height: 64px; display: flex; align-items: center; box-shadow: 0 1px 4px #0001; }
  .header-inner { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .header-title { display: flex; align-items: center; gap: 10px; }
  .header-title h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; color: #1a1a2e; }
  .live-badge { background: #dcfce7; color: #16a34a; font-size: 12px; padding: 3px 10px; border-radius: 99px; font-weight: 700; border: 1px solid #bbf7d0; white-space: nowrap; }
  .host-area { display: flex; gap: 8px; align-items: center; }
  .host-input { background: #f5f5f7; border: 1.5px solid #dde0e8; color: #1a1a2e; padding: 8px 12px; border-radius: 10px; font-size: 15px; width: 100px; outline: none; font-family: inherit; }
  .btn-host { background: #4f46e5; color: #fff; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600; font-family: inherit; }
  .host-badge { background: #ede9fe; color: #6d28d9; font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 1px solid #c4b5fd; font-weight: 700; }

  /* Sidebar */
  .sidebar { width: 260px; min-width: 260px; border-right: 1.5px solid #dde0e8; padding: 24px 16px; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; background: #fff; }
  .sidebar-label { font-size: 12px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; padding: 0 10px; }
  .cat-btn { width: 100%; text-align: left; background: transparent; border: none; color: #6b7280; padding: 10px 12px; border-radius: 10px; font-size: 16px; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: space-between; gap: 6px; transition: all 0.12s; margin-bottom: 2px; }
  .cat-btn:hover { background: #f0f0ff; color: #4f46e5; }
  .cat-btn.active { background: #eef2ff; color: #4f46e5; font-weight: 700; }
  .cat-count { background: #e5e7eb; color: #6b7280; font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; min-width: 24px; text-align: center; }
  .cat-btn.active .cat-count { background: #c7d2fe; color: #4338ca; }
  .cat-delete { background: transparent; border: none; color: #d1d5db; cursor: pointer; font-size: 16px; padding: 0 3px; display: none; line-height: 1; }
  .cat-btn:hover .cat-delete { display: inline; color: #ef4444; }

  .add-cat-row { display: flex; gap: 6px; margin-top: 14px; padding: 0 4px; }
  .add-cat-input { flex: 1; background: #f5f5f7; border: 1.5px solid #dde0e8; color: #1a1a2e; padding: 8px 10px; border-radius: 9px; font-size: 15px; font-family: inherit; outline: none; }
  .add-cat-btn { background: #4f46e5; color: #fff; border: none; border-radius: 9px; padding: 8px 12px; cursor: pointer; font-size: 18px; font-weight: 700; }

  /* Main */
  .main { flex: 1; padding: 24px 28px 80px; max-width: 720px; }

  /* Ask box */
  .ask-box { background: #fff; border: 1.5px solid #dde0e8; border-radius: 16px; padding: 20px 22px; margin-bottom: 20px; box-shadow: 0 1px 4px #0001; }
  .ask-label { font-size: 13px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 12px; }
  .ask-box input[type=text], .ask-box textarea, .ask-box select { width: 100%; background: #f9fafb; border: 1.5px solid #e5e7eb; color: #1a1a2e; padding: 11px 14px; border-radius: 10px; font-size: 16px; font-family: inherit; outline: none; margin-bottom: 10px; display: block; }
  .ask-box input[type=text]:focus, .ask-box textarea:focus, .ask-box select:focus { border-color: #4f46e5; background: #fff; }
  .ask-box textarea { resize: vertical; }
  .ask-box select option { background: #fff; }

  .img-upload-area { border: 2px dashed #d1d5db; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: border-color 0.15s; background: #f9fafb; }
  .img-upload-area:hover { border-color: #4f46e5; background: #f0f0ff; }
  .img-upload-text { font-size: 15px; color: #9ca3af; }
  .img-preview-wrap { position: relative; display: inline-block; margin-bottom: 10px; }
  .img-preview { max-width: 100%; max-height: 200px; border-radius: 10px; display: block; border: 1px solid #e5e7eb; }
  .img-remove { position: absolute; top: 6px; right: 6px; background: #ffffffcc; color: #374151; border: 1px solid #d1d5db; border-radius: 99px; width: 26px; height: 26px; cursor: pointer; font-size: 13px; }
  input[type=file] { display: none; }

  .ask-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .ask-hint { font-size: 13px; color: #9ca3af; }
  .btn-submit { background: #4f46e5; color: #fff; border: none; padding: 11px 24px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: 700; font-family: inherit; }
  .btn-submit:disabled { background: #e5e7eb; color: #9ca3af; cursor: default; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; background: #fff; border: 1.5px solid #dde0e8; border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .tab { flex: 1; padding: 10px 0; border-radius: 9px; border: none; background: transparent; color: #9ca3af; font-size: 16px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .tab.active { background: #eef2ff; color: #4f46e5; font-weight: 700; }

  .host-name-row { margin-bottom: 14px; }
  .host-name-row input { width: 100%; background: #fff; border: 1.5px solid #c4b5fd; color: #1a1a2e; padding: 10px 14px; border-radius: 10px; font-size: 15px; font-family: inherit; outline: none; }

  /* Card */
  .card { background: #fff; border: 1.5px solid #e5e7eb; border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; box-shadow: 0 1px 3px #0001; }
  .card-top { display: flex; gap: 12px; align-items: flex-start; }
  .card-body { flex: 1; min-width: 0; }
  .card-cat-tag { display: inline-block; background: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; font-size: 12px; padding: 2px 10px; border-radius: 99px; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .card-text { font-size: 17px; line-height: 1.55; margin-bottom: 6px; color: #1a1a2e; font-weight: 500; }
  .card-meta { font-size: 13px; color: #9ca3af; margin-bottom: 4px; }
  .card-meta .asker { color: #4f46e5; font-weight: 700; }
  .card-img { max-width: 100%; max-height: 260px; border-radius: 10px; margin-top: 8px; cursor: pointer; display: block; border: 1px solid #e5e7eb; }
  .vote-col { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 38px; }
  .btn-vote { background: #f9fafb; color: #9ca3af; border: 1.5px solid #e5e7eb; border-radius: 10px; padding: 6px 10px; cursor: pointer; font-size: 15px; font-family: inherit; }
  .btn-vote.voted { background: #eef2ff; color: #4f46e5; border-color: #c7d2fe; }
  .vote-count { font-size: 15px; font-weight: 700; color: #9ca3af; }
  .vote-count.has-votes { color: #4f46e5; }

  /* Answer */
  .answer-block { margin-top: 12px; padding: 12px 16px; background: #f0fdf4; border-radius: 10px; border-left: 4px solid #22c55e; }
  .answer-by { font-size: 13px; color: #16a34a; font-weight: 700; margin-bottom: 4px; }
  .answer-text { font-size: 16px; line-height: 1.55; color: #374151; }
  .answer-img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 8px; cursor: pointer; display: block; }

  /* Host controls */
  .host-answer-row { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .host-answer-row input[type=text] { flex: 1; min-width: 140px; background: #f9fafb; border: 1.5px solid #e5e7eb; color: #1a1a2e; padding: 10px 14px; border-radius: 10px; font-size: 15px; font-family: inherit; outline: none; }
  .btn-answer { background: #16a34a; color: #fff; border: none; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 700; font-family: inherit; }
  .btn-attach { background: #f9fafb; border: 1.5px solid #e5e7eb; color: #6b7280; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 16px; }
  .host-img-preview img { max-height: 100px; border-radius: 8px; margin-top: 8px; border: 1px solid #e5e7eb; }

  .host-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .btn-move { background: #f9fafb; border: 1.5px solid #e5e7eb; color: #6b7280; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit; }
  .btn-move:focus { outline: none; }
  .btn-edit { background: #fff; border: 1.5px solid #e5e7eb; color: #6b7280; font-size: 14px; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; }
  .btn-edit:hover { border-color: #4f46e5; color: #4f46e5; }
  .btn-delete { background: #fff; border: 1.5px solid #fecaca; color: #ef4444; font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; }
  .btn-delete:hover { background: #fef2f2; }

  /* Edit mode */
  .edit-box { background: #f9fafb; border-radius: 10px; padding: 14px 16px; margin-top: 10px; border: 1.5px solid #e5e7eb; }
  .edit-box textarea, .edit-box input { width: 100%; background: #fff; border: 1.5px solid #e5e7eb; color: #1a1a2e; padding: 10px 12px; border-radius: 8px; font-size: 16px; font-family: inherit; outline: none; margin-bottom: 8px; display: block; resize: vertical; }
  .edit-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn-save { background: #4f46e5; color: #fff; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; font-family: inherit; }
  .btn-cancel-edit { background: #fff; border: 1.5px solid #e5e7eb; color: #6b7280; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 15px; font-family: inherit; }

  .empty { text-align: center; padding: 56px 0; color: #9ca3af; font-size: 17px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #16a34a; color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 15px; font-weight: 600; z-index: 999; display: none; white-space: nowrap; box-shadow: 0 4px 12px #0002; }
  .toast.error { background: #dc2626; }

  /* Custom confirm modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: #00000066; z-index: 2000; align-items: center; justify-content: center; padding: 24px; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 8px 32px #0002; }
  .modal-title { font-size: 19px; font-weight: 800; margin-bottom: 8px; color: #1a1a2e; }
  .modal-desc { font-size: 15px; color: #6b7280; margin-bottom: 24px; line-height: 1.5; }
  .modal-btns { display: flex; gap: 12px; }
  .modal-btn-cancel { flex: 1; background: #f3f4f6; color: #374151; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .modal-btn-confirm { flex: 1; background: #dc2626; color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }

  .lightbox { display: none; position: fixed; inset: 0; background: #000000dd; z-index: 1000; align-items: center; justify-content: center; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 94vw; max-height: 90vh; border-radius: 12px; }
  .lightbox-close { position: fixed; top: 18px; right: 22px; background: #fff2; border: none; color: #fff; font-size: 30px; cursor: pointer; }

  @media (max-width: 640px) {
    .sidebar { width: 220px; min-width: 220px; }
    .main { padding: 16px 14px 80px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-title">
      <h1>BIPO Q&amp;A LIVE</h1>
      <span class="live-badge">● LIVE</span>
    </div>
    <div class="host-area" id="hostArea">
      <input class="host-input" type="password" id="hostCodeInput" placeholder="Host code" onkeydown="if(event.key==='Enter')tryHost()">
      <button class="btn-host" onclick="tryHost()">Host</button>
    </div>
  </div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-label">Topics</div>
    <div id="catList"></div>
    <div id="addCatSection" style="display:none">
      <div class="add-cat-row">
        <input class="add-cat-input" id="newCatInput" placeholder="New topic…" onkeydown="if(event.key==='Enter')addCategory()">
        <button class="add-cat-btn" onclick="addCategory()">+</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="ask-box">
      <div class="ask-label">Ask a Question</div>
      <input type="text" id="askerName" placeholder="Your name (optional)">
      <select id="questionCat">
        <option value="">— Select topic (optional) —</option>
      </select>
      <textarea id="questionText" rows="3" placeholder="Type your question here…" oninput="updateSubmitBtn()"></textarea>
      <div id="imgUploadArea" class="img-upload-area" onclick="document.getElementById('fileInput').click()">
        <span>📎</span>
        <span class="img-upload-text">Attach an image (optional)</span>
      </div>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
      <div id="imgPreviewWrap" style="display:none" class="img-preview-wrap">
        <img id="imgPreview" class="img-preview">
        <button class="img-remove" onclick="clearImage()">✕</button>
      </div>
      <div class="ask-footer">
        <span class="ask-hint">Ctrl+Enter to send</span>
        <button class="btn-submit" id="btnSubmit" disabled onclick="submitQuestion()">Submit</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabOpen" onclick="switchTab('open')">Open (<span id="openCount">0</span>)</button>
      <button class="tab" id="tabAnswered" onclick="switchTab('answered')">Answered (<span id="answeredCount">0</span>)</button>
    </div>

    <div class="host-name-row" id="hostNameRow" style="display:none">
      <input type="text" id="hostName" placeholder="Host display name e.g. BIPO Team">
    </div>

    <div id="questionList"></div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title">Delete this question?</div>
    <div class="modal-desc">This cannot be undone.</div>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="modal-btn-confirm" id="confirmBtn">Delete</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close">✕</button>
  <img id="lightboxImg" src="">
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiFNnUzVa6Hr98lEF4Rs3NgAOiRFfQhqM",
  authDomain: "bipo-qna-live.firebaseapp.com",
  databaseURL: "https://bipo-qna-live-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bipo-qna-live",
  storageBucket: "bipo-qna-live.firebasestorage.app",
  messagingSenderId: "167645059326",
  appId: "1:167645059326:web:df0f0a8bc391e2ec2d2daf"
};

const IMGBB_API_KEY = "5d4021263e24001634d770669546d7d6";
const HOST_SECRET = "bipo2024";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const qRef = ref(db, "questions");
const catRef = ref(db, "categories");

let isHost = false, currentTab = "open", currentCat = "all";
let allQuestions = [], allCategories = [];
let selectedFile = null, hostSelectedFile = {}, editingQ = {};

function getUid() {
  let uid = localStorage.getItem("bipo-uid");
  if (!uid) { uid = Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem("bipo-uid",uid); }
  return uid;
}
function timeAgo(ts) {
  const d = Math.floor((Date.now()-ts)/1000);
  if (d<60) return `${d}s`; if (d<3600) return `${Math.floor(d/60)}m`;
  if (d<86400) return `${Math.floor(d/3600)}h`; return `${Math.floor(d/86400)}d`;
}
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
async function uploadImage(file) {
  const fd = new FormData(); fd.append("image", file);
  const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {method:"POST",body:fd});
  const j = await r.json();
  if (j.success) return j.data.url;
  throw new Error("Upload failed");
}

onValue(catRef, snap => {
  const data = snap.val()||{};
  allCategories = Object.entries(data).map(([id,v])=>({id,name:v.name}));
  renderSidebar(); renderCatSelect();
});
onValue(qRef, snap => {
  const data = snap.val()||{};
  allQuestions = Object.entries(data).map(([id,v])=>({id,...v}));
  renderSidebar(); renderList();
});

function renderSidebar() {
  let html = `<button class="cat-btn ${currentCat==='all'?'active':''}" onclick="selectCat('all')">
    <span>All Questions</span><span class="cat-count">${allQuestions.length}</span>
  </button>`;
  allCategories.forEach(c => {
    const cnt = allQuestions.filter(q=>q.category===c.id).length;
    html += `<button class="cat-btn ${currentCat===c.id?'active':''}" onclick="selectCat('${c.id}')">
      <span>${escHtml(c.name)}</span>
      <span style="display:flex;gap:5px;align-items:center">
        <span class="cat-count">${cnt}</span>
        ${isHost?`<span class="cat-delete" onclick="event.stopPropagation();deleteCat('${c.id}')">✕</span>`:''}
      </span>
    </button>`;
  });
  document.getElementById("catList").innerHTML = html;
  document.getElementById("addCatSection").style.display = isHost?"block":"none";
}

function renderCatSelect() {
  const sel = document.getElementById("questionCat");
  const cur = sel.value;
  sel.innerHTML = `<option value="">— Select topic (optional) —</option>`;
  allCategories.forEach(c => {
    sel.innerHTML += `<option value="${c.id}" ${cur===c.id?'selected':''}>${escHtml(c.name)}</option>`;
  });
}

function renderList() {
  let list = currentTab==="open" ? allQuestions.filter(q=>!q.answered) : allQuestions.filter(q=>q.answered);
  if (currentCat!=="all") list = list.filter(q=>q.category===currentCat);
  list = currentTab==="open" ? list.sort((a,b)=>(b.likes||0)-(a.likes||0)||b.ts-a.ts) : list.sort((a,b)=>b.answeredTs-a.answeredTs);

  const openF = currentCat==="all" ? allQuestions.filter(q=>!q.answered) : allQuestions.filter(q=>!q.answered&&q.category===currentCat);
  const ansF = currentCat==="all" ? allQuestions.filter(q=>q.answered) : allQuestions.filter(q=>q.answered&&q.category===currentCat);
  document.getElementById("openCount").textContent = openF.length;
  document.getElementById("answeredCount").textContent = ansF.length;

  const uid = getUid();
  const container = document.getElementById("questionList");
  const catMap = {}; allCategories.forEach(c=>catMap[c.id]=c.name);

  if (list.length===0) {
    container.innerHTML = `<div class="empty">${currentTab==="open"?"No questions yet — be the first to ask!":"No answered questions yet."}</div>`;
    return;
  }

  container.innerHTML = list.map(q => {
    const liked = (q.likedBy||{})[uid];
    const likes = q.likes||0;
    const catName = q.category && catMap[q.category] ? catMap[q.category] : null;
    const isEditingQ = editingQ[q.id]==='question';
    const isEditingA = editingQ[q.id]==='answer';
    return `<div class="card" id="card_${q.id}">
      <div class="card-top">
        <div class="card-body">
          ${catName?`<span class="card-cat-tag">${escHtml(catName)}</span>`:''}
          ${isEditingQ?`<div class="edit-box"><textarea id="editQ_${q.id}" rows="3">${escHtml(q.text)}</textarea><div class="edit-actions"><button class="btn-cancel-edit" onclick="cancelEdit('${q.id}')">Cancel</button><button class="btn-save" onclick="saveEditQ('${q.id}')">Save</button></div></div>`:`<div class="card-text">${escHtml(q.text)}</div>`}
          <div class="card-meta"><span class="asker">${escHtml(q.asker||'Anonymous')}</span> · ${timeAgo(q.ts)}</div>
          ${q.imageUrl?`<img class="card-img" src="${q.imageUrl}" onclick="openLightbox('${q.imageUrl}')" alt="image">`:''}
        </div>
        <div class="vote-col">
          <button class="btn-vote ${liked?'voted':''}" onclick="toggleLike('${q.id}')">▲</button>
          <span class="vote-count ${likes>0?'has-votes':''}">${likes}</span>
        </div>
      </div>
      ${q.answered?`<div class="answer-block"><div class="answer-by">✓ ${escHtml(q.answeredBy||'Host')} · ${timeAgo(q.answeredTs)}</div>${isEditingA?`<div class="edit-box" style="background:transparent;border:none;padding:0;margin-top:6px"><textarea id="editA_${q.id}" rows="3">${escHtml(q.answer)}</textarea><div class="edit-actions"><button class="btn-cancel-edit" onclick="cancelEdit('${q.id}')">Cancel</button><button class="btn-save" onclick="saveEditA('${q.id}')">Save</button></div></div>`:`<div class="answer-text">${escHtml(q.answer)}</div>`}${q.answerImageUrl?`<img class="answer-img" src="${q.answerImageUrl}" onclick="openLightbox('${q.answerImageUrl}')" alt="image">`:''}
      </div>`:''}
      ${isHost&&!q.answered?`<div class="host-answer-row"><input type="text" id="ans_${q.id}" placeholder="Type your answer…" onkeydown="if(event.key==='Enter')submitAnswer('${q.id}')"><button class="btn-attach" onclick="document.getElementById('hostFile_${q.id}').click()">📎</button><input type="file" id="hostFile_${q.id}" accept="image/*" onchange="handleHostFile(event,'${q.id}')"><button class="btn-answer" onclick="submitAnswer('${q.id}')">Answer</button></div><div class="host-img-preview" id="hostPreview_${q.id}"></div>`:''}
      ${isHost?`<div class="host-actions"><select class="btn-move" onchange="moveTopic('${q.id}',this.value)"><option value="">Move to topic…</option><option value="__none__">— No topic —</option>${allCategories.map(c=>`<option value="${c.id}" ${q.category===c.id?'selected':''}>${escHtml(c.name)}</option>`).join('')}</select><button class="btn-edit" onclick="startEdit('${q.id}','question')">Edit question</button>${q.answered?`<button class="btn-edit" onclick="startEdit('${q.id}','answer')">Edit answer</button>`:''}<button class="btn-delete" onclick="deleteQ('${q.id}')">Delete</button></div>`:''}
    </div>`;
  }).join("");
}

window.selectCat = id => { currentCat=id; renderSidebar(); renderList(); };
window.addCategory = function() { const i=document.getElementById("newCatInput"); const n=i.value.trim(); if(!n)return; push(catRef,{name:n}); i.value=""; };
window.deleteCat = id => { if(confirm("Delete this topic?")) remove(ref(db,`categories/${id}`)); };

window.submitQuestion = async function() {
  const text = document.getElementById("questionText").value.trim(); if(!text)return;
  const asker = document.getElementById("askerName").value.trim()||"Anonymous";
  const category = document.getElementById("questionCat").value||null;
  const btn = document.getElementById("btnSubmit"); btn.textContent="Uploading…"; btn.disabled=true;
  let imageUrl=null;
  if(selectedFile){try{imageUrl=await uploadImage(selectedFile);}catch{showToast("Image upload failed",true);}}
  push(qRef,{text,asker,ts:Date.now(),answered:false,likes:0,likedBy:{},...(category&&{category}),...(imageUrl&&{imageUrl})});
  document.getElementById("questionText").value=""; window.clearImage();
  btn.textContent="Submit"; showToast("Question submitted!");
};
window.updateSubmitBtn = function() { const b=document.getElementById("btnSubmit"); if(b.textContent!=="Uploading…") b.disabled=!document.getElementById("questionText").value.trim(); };
document.getElementById("questionText").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))window.submitQuestion();});

window.handleFileSelect = function(e) {
  const file=e.target.files[0]; if(!file)return;
  if(file.size>10*1024*1024){showToast("Max 10MB",true);return;}
  selectedFile=file;
  const r=new FileReader(); r.onload=ev=>{document.getElementById("imgPreview").src=ev.target.result;document.getElementById("imgPreviewWrap").style.display="inline-block";document.getElementById("imgUploadArea").style.display="none";}; r.readAsDataURL(file);
};
window.clearImage = function() { selectedFile=null; document.getElementById("fileInput").value=""; document.getElementById("imgPreviewWrap").style.display="none"; document.getElementById("imgUploadArea").style.display="flex"; };
window.handleHostFile = function(e,qId) {
  const file=e.target.files[0]; if(!file)return; hostSelectedFile[qId]=file;
  const r=new FileReader(); r.onload=ev=>{const p=document.getElementById(`hostPreview_${qId}`);if(p)p.innerHTML=`<img src="${ev.target.result}"><button onclick="clearHostFile('${qId}')" style="background:transparent;border:none;color:#dc2626;cursor:pointer;font-size:13px;margin-left:8px;">Remove</button>`;}; r.readAsDataURL(file);
};
window.clearHostFile = qId => { hostSelectedFile[qId]=null; const p=document.getElementById(`hostPreview_${qId}`); if(p)p.innerHTML=""; };

window.toggleLike = function(id) {
  const uid=getUid(); const q=allQuestions.find(x=>x.id===id); if(!q)return;
  const liked=(q.likedBy||{})[uid];
  update(ref(db,`questions/${id}`),{likes:(q.likes||0)+(liked?-1:1),[`likedBy/${uid}`]:liked?null:true});
};

window.submitAnswer = async function(id) {
  const input=document.getElementById(`ans_${id}`); const text=input?.value?.trim(); if(!text)return;
  const hostName=document.getElementById("hostName").value.trim()||"Host";
  let answerImageUrl=null;
  if(hostSelectedFile[id]){try{answerImageUrl=await uploadImage(hostSelectedFile[id]);}catch{showToast("Image upload failed",true);}}
  update(ref(db,`questions/${id}`),{answered:true,answer:text,answeredBy:hostName,answeredTs:Date.now(),...(answerImageUrl&&{answerImageUrl})});
  window.clearHostFile(id);
};

window.startEdit = (id,type) => { editingQ[id]=type; renderList(); };
window.cancelEdit = id => { delete editingQ[id]; renderList(); };
window.saveEditQ = function(id) { const t=document.getElementById(`editQ_${id}`)?.value?.trim(); if(!t)return; update(ref(db,`questions/${id}`),{text:t}); delete editingQ[id]; };
window.saveEditA = function(id) { const t=document.getElementById(`editA_${id}`)?.value?.trim(); if(!t)return; update(ref(db,`questions/${id}`),{answer:t}); delete editingQ[id]; };
window.moveTopic = (id,catId) => { if(catId==="")return; update(ref(db,`questions/${id}`),{category:catId==="__none__"?null:catId}); };

window.deleteQ = function(id) {
  const modal=document.getElementById("confirmModal");
  const btn=document.getElementById("confirmBtn");
  modal.classList.add("open");
  btn.onclick=function(){remove(ref(db,`questions/${id}`));modal.classList.remove("open");};
};
window.closeConfirm = () => document.getElementById("confirmModal").classList.remove("open");

window.tryHost = function() {
  const code=document.getElementById("hostCodeInput").value;
  if(code===HOST_SECRET){isHost=true;document.getElementById("hostArea").innerHTML=`<span class="host-badge">Host mode</span>`;document.getElementById("hostNameRow").style.display="block";renderSidebar();renderList();}
  else showToast("Wrong code, try again.",true);
};
window.switchTab = tab => { currentTab=tab; document.getElementById("tabOpen").classList.toggle("active",tab==="open"); document.getElementById("tabAnswered").classList.toggle("active",tab==="answered"); renderList(); };
window.openLightbox = url => { document.getElementById("lightboxImg").src=url; document.getElementById("lightbox").classList.add("open"); };
window.closeLightbox = () => document.getElementById("lightbox").classList.remove("open");

function showToast(msg,isError=false) {
  const t=document.getElementById("toast"); t.textContent=msg; t.className="toast"+(isError?" error":"");
  t.style.display="block"; setTimeout(()=>t.style.display="none",2500);
}
</script>
</body>
</html>
